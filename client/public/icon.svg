<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8956f"/>
      <stop offset="100%" stop-color="#d4764e"/>
    </radialGradient>
    <radialGradient id="plate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#faf3e8"/>
      <stop offset="100%" stop-color="#f0e4d4"/>
    </radialGradient>
    <linearGradient id="brain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8b84b"/>
      <stop offset="50%" stop-color="#c49a4a"/>
      <stop offset="100%" stop-color="#7a9a5a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Outer plate rings -->
  <circle cx="256" cy="230" r="195" fill="none" stroke="#f5e6d3" stroke-width="4" opacity="0.6"/>
  <circle cx="256" cy="230" r="185" fill="none" stroke="#d4764e" stroke-width="3" opacity="0.5"/>
  <circle cx="256" cy="230" r="175" fill="none" stroke="#f5e6d3" stroke-width="2" opacity="0.4"/>

  <!-- Plate center -->
  <circle cx="256" cy="230" r="160" fill="url(#plate)"/>

  <!-- Inner plate rings -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="#d4a06a" stroke-width="2" opacity="0.4"/>
  <circle cx="256" cy="230" r="120" fill="none" stroke="#d4a06a" stroke-width="1.5" opacity="0.3"/>

  <!-- Brain shape with circuit nodes -->
  <g transform="translate(256, 230)" stroke="url(#brain)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Brain outline - left hemisphere -->
    <path d="M-55,-15 C-70,-35 -50,-65 -20,-60 C-10,-58 5,-50 10,-40"/>
    <!-- Brain outline - right hemisphere -->
    <path d="M10,-40 C20,-55 45,-60 60,-45 C75,-30 65,-5 55,10"/>
    <!-- Brain bottom -->
    <path d="M55,10 C60,30 40,55 15,50 C5,48 -5,55 -20,50 C-40,45 -55,25 -55,-15"/>

    <!-- Brain folds - left -->
    <path d="M-45,-25 C-35,-35 -25,-30 -20,-20"/>
    <path d="M-40,-5 C-30,-10 -20,-5 -15,5"/>
    <path d="M-35,15 C-25,10 -15,15 -10,25"/>

    <!-- Brain folds - right -->
    <path d="M20,-30 C30,-35 40,-25 45,-15"/>
    <path d="M25,-5 C35,-10 45,0 40,10"/>
    <path d="M20,20 C30,15 40,20 35,30"/>

    <!-- Circuit nodes -->
    <circle cx="-55" cy="-15" r="4" fill="#e8b84b" stroke="none"/>
    <circle cx="-20" cy="-60" r="4" fill="#e8b84b" stroke="none"/>
    <circle cx="60" cy="-45" r="4" fill="#7a9a5a" stroke="none"/>
    <circle cx="55" cy="10" r="4" fill="#7a9a5a" stroke="none"/>
    <circle cx="15" cy="50" r="4" fill="#c49a4a" stroke="none"/>
    <circle cx="-20" cy="50" r="4" fill="#c49a4a" stroke="none"/>
    <circle cx="-40" cy="45" r="3" fill="#e8b84b" stroke="none"/>

    <!-- Circuit lines connecting nodes -->
    <path d="M-55,-15 L-65,-25" stroke-width="2"/>
    <path d="M-20,-60 L-15,-75" stroke-width="2"/>
    <path d="M60,-45 L70,-50" stroke-width="2"/>
    <path d="M55,10 L65,15" stroke-width="2"/>
    <path d="M15,50 L10,65" stroke-width="2"/>
    <path d="M-20,50 L-25,65" stroke-width="2"/>

    <!-- Fork integrated into brain -->
    <g transform="translate(-5, -20) rotate(-15)" stroke="#c49a4a" stroke-width="2.5" fill="none">
      <path d="M0,-20 L0,25"/>
      <path d="M-5,-20 L-5,-8"/>
      <path d="M0,-20 L0,-8"/>
      <path d="M5,-20 L5,-8"/>
      <path d="M-5,-8 Q0,-3 5,-8"/>
    </g>

    <!-- Spoon integrated into brain -->
    <g transform="translate(10, 5) rotate(20)" stroke="#7a9a5a" stroke-width="2.5" fill="none">
      <path d="M0,15 L0,-10"/>
      <ellipse cx="0" cy="-15" rx="6" ry="8"/>
    </g>
  </g>

  <!-- Small icons at bottom -->
  <g transform="translate(256, 350)" stroke="#d4a06a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Apple -->
    <g transform="translate(-60, 0)">
      <path d="M-8,-5 C-8,-12 0,-15 0,-15 C0,-15 8,-12 8,-5 C8,5 0,12 0,12 C0,12 -8,5 -8,-5Z"/>
      <path d="M0,-15 Q3,-20 6,-18"/>
    </g>
    <!-- Steaming bowl -->
    <g transform="translate(-20, 0)">
      <path d="M-10,0 Q-10,10 0,12 Q10,10 10,0"/>
      <path d="M-3,-5 Q-3,-10 0,-12"/>
      <path d="M3,-5 Q3,-10 0,-12"/>
    </g>
    <!-- Network/molecule -->
    <g transform="translate(20, 0)">
      <circle cx="0" cy="0" r="3" fill="#d4a06a" stroke="none"/>
      <circle cx="-8" cy="-8" r="2.5" fill="#d4a06a" stroke="none"/>
      <circle cx="8" cy="-8" r="2.5" fill="#d4a06a" stroke="none"/>
      <circle cx="-8" cy="8" r="2.5" fill="#d4a06a" stroke="none"/>
      <circle cx="8" cy="8" r="2.5" fill="#d4a06a" stroke="none"/>
      <line x1="0" y1="0" x2="-8" y2="-8"/>
      <line x1="0" y1="0" x2="8" y2="-8"/>
      <line x1="0" y1="0" x2="-8" y2="8"/>
      <line x1="0" y1="0" x2="8" y2="8"/>
    </g>
    <!-- Gear -->
    <g transform="translate(60, 0)">
      <circle cx="0" cy="0" r="8"/>
      <circle cx="0" cy="0" r="4"/>
      <line x1="0" y1="-11" x2="0" y2="-8"/>
      <line x1="0" y1="8" x2="0" y2="11"/>
      <line x1="-11" y1="0" x2="-8" y2="0"/>
      <line x1="8" y1="0" x2="11" y2="0"/>
      <line x1="-8" y1="-8" x2="-6" y2="-6"/>
      <line x1="8" y1="8" x2="6" y2="6"/>
      <line x1="8" y1="-8" x2="6" y2="-6"/>
      <line x1="-8" y1="8" x2="-6" y2="6"/>
    </g>
  </g>
</svg>
